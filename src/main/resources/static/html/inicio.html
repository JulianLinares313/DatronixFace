<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datronix - Panel Principal</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="/css/clientes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body>

    <div class="app-container">

        <!-- MENÚ LATERAL (orden alineado con Lovable) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Datronix</h1>
                <div class="separator"></div>
                <button class="btn-ia" data-vista="ia">
                    <i class="fas fa-robot"></i> IA
                </button>
            </div>
            <nav class="sidebar-nav">
                <!-- 1. Principal -->
                <button class="menu-item active" data-vista="principal">
                    <span class="icon"><i class="fas fa-home"></i></span>
                    <span class="label">Principal</span>
                </button>
                <!-- 2. Ventas -->
                <button class="menu-item" data-vista="ventas">
                    <span class="icon"><i class="fas fa-cash-register"></i></span>
                    <span class="label">Ventas</span>
                </button>
                <!-- 3. Productos -->
                <button class="menu-item" data-vista="productos">
                    <span class="icon"><i class="fas fa-boxes"></i></span>
                    <span class="label">Productos</span>
                </button>
                <!-- 4. Clientes -->
                <button class="menu-item" data-vista="clientes">
                    <span class="icon"><i class="fas fa-users"></i></span>
                    <span class="label">Clientes</span>
                </button>
                <!-- 5. Proveedores -->
                <button class="menu-item" data-vista="proveedores">
                    <span class="icon"><i class="fas fa-truck"></i></span>
                    <span class="label">Proveedores</span>
                </button>
                <!-- 6. Historial y remisiones (antes solo "Historial") -->
                <button class="menu-item" data-vista="historial">
                    <span class="icon"><i class="fas fa-history"></i></span>
                    <span class="label">Historial y remisiones</span>
                </button>
                <!-- 7. Devoluciones -->
                <button class="menu-item" data-vista="devoluciones">
                    <span class="icon"><i class="fas fa-undo-alt"></i></span>
                    <span class="label">Devoluciones</span>
                </button>
                <!-- 8. Nómina (fusiona Empleados) -->
                <button class="menu-item" data-vista="nomina">
                    <span class="icon"><i class="fas fa-file-invoice-dollar"></i></span>
                    <span class="label">Nómina</span>
                </button>
                <!-- 9. Reportes -->
                <button class="menu-item" data-vista="reportes">
                    <span class="icon"><i class="fas fa-chart-bar"></i></span>
                    <span class="label">Reportes</span>
                </button>
                <!-- 10. Soporte -->
                <button class="menu-item" data-vista="soporte">
                    <span class="icon"><i class="fas fa-headset"></i></span>
                    <span class="label">Soporte</span>
                </button>
                <!-- 11. Compras (se mantiene al final, aunque en Lovable no aparece) -->
                <button class="menu-item" data-vista="compras">
                    <span class="icon"><i class="fas fa-shopping-cart"></i></span>
                    <span class="label">Compras</span>
                </button>
            </nav>
            <button class="btn-salir" id="btnSalir">
                <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
                <span class="label">Salir</span>
            </button>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="top-bar">
                <span class="titulo">Administrador / Control / Reportes de ventas</span>
                <span class="fecha" id="fechaActual">Cargando fecha...</span>
            </header>
            <div class="content-area">
                <div id="vistaContainer">
                    <!-- Se inyectan los módulos -->
                </div>
            </div>
        </main>
    </div>

    <script src="/js/inicio.js" type="module"></script>
    
</body>
</html>
