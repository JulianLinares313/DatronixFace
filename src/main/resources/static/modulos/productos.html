<!-- Este fragmento se inserta en el panel y productos.js conecta sus controles. -->
<div class="modulo-clientes">
    <div class="top-bar-modulo">
        <span class="titulo-modulo">📦 Productos</span>
        <div class="user-info-modulo">
            <span>Usuario: <strong id="nombreUsuarioModulo">Cargando...</strong></span>
        </div>
    </div>

    <!-- Barra de herramientas -->
    <div class="toolbar-clientes">
        <div class="busqueda">
            <input type="text" id="txtBuscarProducto" placeholder="Buscar por ID o nombre...">
            <button class="btn btn-primary" id="btnBuscarProducto">Buscar</button>
            <button class="btn btn-outline" id="btnActualizarProducto">↻ Actualizar</button>
        </div>
        <div class="acciones">
            <button class="btn btn-primary" id="btnAgregarProducto">+ Agregar</button>
            <button class="btn btn-primary" id="btnModificarProducto">✎ Modificar</button>
            <button class="btn btn-danger" id="btnEliminarProducto">🗑 Eliminar</button>
        </div>
    </div>

    <!-- Tabla de productos -->
    <div class="table-container">
        <table class="table-datronix" id="tablaProductos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Precio Costo</th>
                    <th>Precio Venta</th>
                    <th>Stock</th>
                    <th>Stock Mínimo</th>
                    <th>Proveedor</th>
                </tr>
            </thead>
            <tbody id="tbodyProductos">
                <tr><td colspan="10" class="text-center">Cargando productos...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Agregar Producto -->
<div class="modal-overlay" id="modalAgregarProducto">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nuevo Producto Datronix</h2>
            <span class="modal-close" id="closeAgregarProducto">&times;</span>
        </div>
        <form id="formAgregarProducto">
            <!-- ID eliminado: se genera automáticamente en la base de datos -->
            <div class="form-group">
                <label>NOMBRE DEL PRODUCTO</label>
                <input type="text" id="txtNombreProducto" placeholder="Nombre" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>CATEGORÍA</label>
                    <input type="text" id="txtCategoriaProducto" placeholder="Categoría">
                </div>
                <div class="form-group">
                    <label>MARCA</label>
                    <input type="text" id="txtMarcaProducto" placeholder="Marca">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>MODELO</label>
                    <input type="text" id="txtModeloProducto" placeholder="Modelo">
                </div>
                <div class="form-group">
                    <label>PRECIO COSTO</label>
                    <input type="number" step="0.01" id="txtPrecioCosto" placeholder="0.00" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>PRECIO VENTA</label>
                    <input type="number" step="0.01" id="txtPrecioVenta" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>STOCK</label>
                    <input type="number" id="txtStockProducto" placeholder="Cantidad" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>STOCK MÍNIMO</label>
                    <input type="number" id="txtStockMinimo" placeholder="Mínimo" required>
                </div>
                <div class="form-group">
                    <label>PROVEEDOR</label>
                    <select id="selectProveedor" required>
                        <option value="">Seleccionar proveedor...</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-success" id="btnGuardarProducto">💾 Guardar</button>
                <button type="button" class="btn btn-outline" id="btnLimpiarProducto">🧹 Limpiar</button>
                <button type="button" class="btn btn-danger" id="btnVolverProducto">⬅ Volver</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar Producto -->
<div class="modal-overlay" id="modalEditarProducto">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Producto Datronix</h2>
            <span class="modal-close" id="closeEditarProducto">&times;</span>
        </div>
        <form id="formEditarProducto">
            <div class="form-group">
                <label>ID PRODUCTO</label>
                <input type="text" id="txtIdProductoEdit" disabled>
            </div>
            <div class="form-group">
                <label>NOMBRE DEL PRODUCTO</label>
                <input type="text" id="txtNombreProductoEdit" placeholder="Nombre" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>CATEGORÍA</label>
                    <input type="text" id="txtCategoriaProductoEdit" placeholder="Categoría">
                </div>
                <div class="form-group">
                    <label>MARCA</label>
                    <input type="text" id="txtMarcaProductoEdit" placeholder="Marca">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>MODELO</label>
                    <input type="text" id="txtModeloProductoEdit" placeholder="Modelo">
                </div>
                <div class="form-group">
                    <label>PRECIO COSTO</label>
                    <input type="number" step="0.01" id="txtPrecioCostoEdit" placeholder="0.00" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>PRECIO VENTA</label>
                    <input type="number" step="0.01" id="txtPrecioVentaEdit" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>STOCK</label>
                    <input type="number" id="txtStockProductoEdit" placeholder="Cantidad" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>STOCK MÍNIMO</label>
                    <input type="number" id="txtStockMinimoEdit" placeholder="Mínimo" required>
                </div>
                <div class="form-group">
                    <label>PROVEEDOR</label>
                    <select id="selectProveedorEdit" required>
                        <option value="">Seleccionar proveedor...</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-success" id="btnGuardarProductoEdit">💾 Guardar</button>
                <button type="button" class="btn btn-outline" id="btnLimpiarProductoEdit">🧹 Limpiar</button>
                <button type="button" class="btn btn-danger" id="btnVolverProductoEdit">⬅ Volver</button>
            </div>
        </form>
    </div>
</div>

<!-- Script específico -->
<script type="module" src="/js/productos.js"></script>
